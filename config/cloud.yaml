# Cloud training configuration for S-GRPO
# Usage: python scripts/sqrpo_train.py $(cat config/cloud.yaml | sed 's/: / /g' | sed 's/^/--/g' | tr '\n' ' ')
# Or use a YAML config loader

# Model configuration
model_name: "Affineme/Affine-5GWqrs7hgWRjj3yMF9uM4fnzowsbYCGugofQ7Bu1AAJ3L9Qz"
use_flash_attention: true
load_in_4bit: false
load_in_8bit: false

# Dataset
train_dataset_path: "datasets/train"

# LoRA configuration
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05

# Training configuration (full settings for cloud)
output_dir: "./models/qwen3-sgrpo-output"
num_train_epochs: 3
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1e-6
weight_decay: 0.01
warmup_ratio: 0.1
clip_grad_norm: 0.5
clip_range: 0.2

# GRPO specific parameters
num_generations: 2
max_input_length: 2048

# S-GRPO specific
max_rounds: 10
round_penalty_weight: 0.1
length_penalty_weight: 0.05

# Optimization settings
bf16: true
gradient_checkpointing: true

# Logging and checkpointing
logging_steps: 10
save_steps: 200
eval_steps: 100
report_to: "wandb"
run_name: "qwen3-sgrpo-cloud"

# Wandb
wandb_log: true
wandb_project: "sgrpo-training"

# Reproducibility
seed: 42

