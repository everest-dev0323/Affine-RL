# Local training configuration for S-GRPO
# Usage: python scripts/sqrpo_train.py $(cat config/local.yaml | sed 's/: / /g' | sed 's/^/--/g' | tr '\n' ' ')
# Or use a YAML config loader

# Model configuration
model_name: "Affineme/Affine-5GWqrs7hgWRjj3yMF9uM4fnzowsbYCGugofQ7Bu1AAJ3L9Qz"
use_flash_attention: true
load_in_4bit: false
load_in_8bit: false

# Dataset
train_dataset_path: "datasets/train"

# LoRA configuration
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05

# Training configuration (reduced for local testing)
output_dir: "./models/qwen3-sgrpo-local"
num_train_epochs: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 1e-6
weight_decay: 0.01
warmup_ratio: 0.1
clip_grad_norm: 0.5
clip_range: 0.2

# GRPO specific parameters
num_generations: 2
max_input_length: 1024

# S-GRPO specific
max_rounds: 10
round_penalty_weight: 0.1
length_penalty_weight: 0.05

# Optimization settings
bf16: true
gradient_checkpointing: true

# Logging and checkpointing (more frequent for debugging)
logging_steps: 5
save_steps: 50
eval_steps: 25
report_to: "wandb"
run_name: "qwen3-sgrpo-local"

# Wandb
wandb_log: false
wandb_project: "sgrpo-training-local"

# Reproducibility
seed: 42

