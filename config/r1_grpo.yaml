# ============================================================================
# GRPO Training Configuration for Game Tasks (Othello)
# ============================================================================
# Usage:
#   accelerate launch --config_file config/deepspeed_zero3.yaml \
#       scripts/rl/r1_grpo.py --config config/r1_grpo.yaml
# ============================================================================

# ----------------------------------------------------------------------------
# Model Arguments
# ----------------------------------------------------------------------------
model_name_or_path: tensorminer/Affine-5EEg3asikmXYbKk86gThAPrSyLG1ZnVZpMNkUJVd5UgU6cTU
model_revision: main
# torch_dtype: bfloat16
attn_implementation: flash_attention_2
trust_remote_code: true

# ----------------------------------------------------------------------------
# LoRA Arguments
# ----------------------------------------------------------------------------
use_peft: true
lora_r: 128
lora_alpha: 256
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# ----------------------------------------------------------------------------
# Dataset Arguments
# ----------------------------------------------------------------------------
dataset_path: dataset/grpo  # Directory containing othello.jsonl, hex.jsonl
max_samples: 1000000  # null for all samples

# ----------------------------------------------------------------------------
# Training Arguments
# ----------------------------------------------------------------------------
output_dir: runs/grpo-othello

# Precision
bf16: true

# Batch size (effective batch = per_device * gradient_accum * num_gpus)
# 8 x H200: per_device=8, grad_accum=4, num_gpus=8 -> 256 samples per optimizer update (32 prompts), 16 optimizer updates per vllm/train switch turn
per_device_train_batch_size: 2
gradient_accumulation_steps: 4

# Gradient checkpointing (saves memory)
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

# Optimizer
learning_rate: 1.0e-4
lr_scheduler_type: constant
# warmup_ratio: 0.00
warmup_steps: 50
weight_decay: 0.01
max_grad_norm: 1.0

# Training duration
max_steps: 10000
# num_train_epochs: 1  # Alternative to max_steps

# ----------------------------------------------------------------------------
# GRPO Specific Parameters
# ----------------------------------------------------------------------------
beta: 0.001  # KL penalty coefficient
max_prompt_length: 16384
max_completion_length: 16384
num_generations: 8  # Number of completions per prompt
generation_batch_size: 128  # 16 prompts × 8 completions

# vLLM for fast generation (colocate mode - weights synced with training)
use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.6
vllm_max_model_length: 32768  # 32K to match max_prompt_length + max_completion_length
vllm_enable_sleep_mode: true

# Server mode (alternative - run vLLM separately, weights NOT synced)
# Start server first: CUDA_VISIBLE_DEVICES=7 trl vllm-serve --model Qwen/Qwen2.5-3B-Instruct --gpu_memory_utilization 0.9
# use_vllm: true
# vllm_mode: server
# vllm_server_host: localhost
# vllm_server_port: 8000
# vllm_server_timeout: 300.0

# ----------------------------------------------------------------------------
# Logging & Checkpointing
# ----------------------------------------------------------------------------
logging_strategy: steps
logging_steps: 1
report_to:
  - wandb

# Wandb settings
run_name: r1_grpo_4b_run1

save_strategy: steps
save_steps: 50
save_total_limit: 3

seed: 42

# ----------------------------------------------------------------------------
# Hub Settings (disabled)
# ----------------------------------------------------------------------------
push_to_hub: false