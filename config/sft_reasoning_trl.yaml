# SFT Reasoning Training Config (TRL-based)
# Uses HuggingFace TRL's SFTTrainer - simpler and more standard

# Model Configuration
model_name: "godninja/Affine-jeep_v6-5CG64fEwbCN6ysc3wVWfyTWjEKCCvtpjZ5dS5f43P4f3oXXY"
max_seq_length: 16384
load_in_4bit: false  # Full precision (bf16) for best quality

# LoRA Configuration
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05

# Training Configuration
output_dir: "outputs/sft_reasoning_trl"
data_dir: "data_sft"  # Directory with JSONL conversation files
num_train_epochs: 3
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 2.0e-5
warmup_ratio: 0.1
max_grad_norm: 1.0

# Efficiency
bf16: true
gradient_checkpointing: true

# Logging & Checkpointing
logging_steps: 10
save_steps: 500
eval_steps: 500
save_total_limit: 3

# Wandb
use_wandb: true
wandb_project: "sft-trl"
wandb_run_name: "01-21"  # Auto-generated if null

